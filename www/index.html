<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Sterling">
<meta name="theme-color" content="#000000">
<title>Sterling</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#000;--fg:#fff;--g1:#0d0d0d;--g2:#1a1a1a;--g3:#2e2e2e;--g4:#6f6f6f;--g5:#a8a8a8}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{padding-top:env(safe-area-inset-top)}
#app{max-width:520px;margin:0 auto;padding:14px 14px calc(92px + env(safe-area-inset-bottom))}
h1,h2,h3{margin:0;letter-spacing:-.01em}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.14em;color:var(--g5);margin:22px 4px 10px;font-weight:600}
p{margin:0 0 10px;line-height:1.5}
ul{margin:0 0 10px;padding-left:20px;line-height:1.5}li{margin-bottom:4px}
.card{background:var(--g1);border:1px solid var(--g3);border-radius:18px;padding:14px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.muted{color:var(--g5);font-size:13px}
.tiny{color:var(--g4);font-size:11px;line-height:1.4}
.big{font-size:30px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.mid{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
.bar{height:8px;background:var(--g3);border-radius:99px;overflow:hidden;margin:8px 0 4px}
.bar>i{display:block;height:100%;background:#fff;border-radius:99px;transition:width .5s}
.bar.over>i{background:repeating-linear-gradient(135deg,#fff 0 6px,#555 6px 12px)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.chip{border:1px solid var(--g3);border-radius:99px;padding:4px 10px;font-size:12px;font-weight:600}
button,.btn{font:inherit;color:var(--bg);background:var(--fg);border:0;border-radius:12px;padding:12px 16px;font-weight:700;cursor:pointer}
button.ghost{background:transparent;color:var(--fg);border:1px solid var(--g4)}
button.sm{padding:7px 12px;font-size:13px;border-radius:10px}
button:disabled{opacity:.35}
button.full{width:100%}
input[type=text],input[type=date],input[type=url],input[type=number],select,textarea{width:100%;background:#000;color:#fff;border:1px solid var(--g3);border-radius:12px;padding:12px;font:inherit;font-size:16px;color-scheme:dark}
textarea{min-height:110px;font-size:12px;font-family:ui-monospace,Menlo,monospace}
input[type=number]{-moz-appearance:textfield;appearance:textfield}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.fld{margin-bottom:10px}.fld>.muted{margin-bottom:5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
.stat .muted{font-size:11px;text-transform:uppercase;letter-spacing:.1em}
.stat .mid{margin-top:3px}
nav{position:fixed;left:0;right:0;bottom:0;background:rgba(0,0,0,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--g3);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav .in{display:flex;width:100%;max-width:520px}
nav button{flex:1;min-width:0;background:transparent;color:var(--g4);border-radius:0;padding:10px 0 9px;font-size:9.5px;letter-spacing:.04em;text-transform:uppercase}
nav button.on{color:#fff}
nav button svg{display:block;margin:0 auto 3px}
#toast{position:fixed;top:calc(10px + env(safe-area-inset-top));left:50%;transform:translate(-50%,-120px);background:#fff;color:#000;font-weight:700;font-size:14px;padding:11px 16px;border-radius:14px;z-index:60;transition:transform .35s;max-width:92%;text-align:center}
#toast.show{transform:translate(-50%,0)}
.seg{display:flex;gap:6px;background:var(--g1);border:1px solid var(--g3);border-radius:14px;padding:4px;margin-bottom:12px}
.seg button{flex:1;background:transparent;color:var(--g5);padding:9px 4px;font-size:13px;border-radius:10px}
.seg button.on{background:#fff;color:#000}
.scroll{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px}
.scroll button{background:transparent;color:var(--g5);border:1px solid var(--g3);padding:7px 12px;font-size:12px;border-radius:99px;white-space:nowrap}
.scroll button.on{background:#fff;color:#000;border-color:#fff}
label.sw{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:14px}
label.sw input{width:22px;height:22px;accent-color:#fff}
.tx{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--g2)}
.tx:last-child{border-bottom:0}
.tx .amt{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.dh{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--g4);margin:12px 0 2px}
.cat{padding:11px 0;border-bottom:1px solid var(--g2);cursor:pointer}
.cat:last-child{border-bottom:0}
.up{color:#fff;font-weight:700}.dn{color:var(--g5);font-weight:700}
.tag{font-size:10px;font-weight:800;letter-spacing:.08em;border:1px solid var(--g4);color:var(--g5);border-radius:6px;padding:1px 5px;margin-left:6px;vertical-align:middle}
.tag.inv{background:#fff;color:#000;border-color:#fff}
.banner{border:1px dashed var(--g4);border-radius:14px;padding:10px 12px;font-size:12px;color:var(--g5);margin-bottom:12px;line-height:1.45}
.stk{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--g2);cursor:pointer}
.stk:last-child{border-bottom:0}
.sym{font-weight:800;font-size:16px;letter-spacing:.02em}
.news{display:block;color:#fff;text-decoration:none;padding:12px 0;border-bottom:1px solid var(--g2)}
.news:last-child{border-bottom:0}
.news .h{font-weight:600;font-size:15px;line-height:1.35}
.step{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--g2)}
.step:last-child{border-bottom:0}
.step .n{width:28px;height:28px;border-radius:99px;border:2px solid var(--g4);display:grid;place-items:center;font-weight:800;font-size:13px;flex:none;color:var(--g5)}
.step.done .n{background:#fff;border-color:#fff;color:#000}
.step.now .n{border-color:#fff;color:#fff}
.step.now{background:linear-gradient(90deg,#161616,transparent);margin:0 -14px;padding:12px 14px}
.step.done .st{color:var(--g4)}
.st{font-weight:700;font-size:15px}
.acc{border-bottom:1px solid var(--g2)}
.acc:last-child{border-bottom:0}
.acc>.ah{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 0;cursor:pointer;font-weight:600;font-size:15px}
.acc>.ab{padding:0 0 8px;font-size:14px;color:#d8d8d8}
.acc .pl{color:var(--g4);font-size:20px;font-weight:300;line-height:1}
.ask{display:flex;flex-direction:column;gap:8px}
.ask button{text-align:left;background:var(--g2);color:#fff;border:1px solid var(--g3);font-weight:600;font-size:14px;padding:12px 14px}
.ask button.on{background:#fff;color:#000;border-color:#fff}
.ans{border-left:3px solid #fff;padding-left:12px;margin-top:12px;font-size:14px;line-height:1.5}
.quote{font-family:Georgia,"Times New Roman",serif;font-style:italic;font-size:15px;line-height:1.45;color:#d8d8d8}
#splash{position:fixed;inset:0;background:#000;z-index:50;display:flex;flex-direction:column;justify-content:center;padding:36px 30px;transition:opacity .7s;cursor:pointer}
#splash.out{opacity:0;pointer-events:none}
#splash .mk{font-size:12px;letter-spacing:.34em;text-transform:uppercase;color:var(--g4);margin-bottom:28px}
#splash .qt{font-family:Georgia,"Times New Roman",serif;font-size:27px;line-height:1.3;font-style:italic;max-width:520px}
#splash .au{margin-top:22px;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--g5);display:flex;align-items:center;gap:12px}
#splash .au:before{content:"";width:30px;height:1px;background:var(--g4)}
#splash .ln{position:absolute;left:30px;right:30px;bottom:calc(36px + env(safe-area-inset-bottom));height:1px;background:var(--g3)}
#splash .ln i{display:block;height:1px;background:#fff;width:0;animation:ln 3.4s linear forwards}
@keyframes ln{to{width:100%}}
.hl{background:#fff;color:#000;border-radius:18px;padding:16px;margin-bottom:12px}
.hl .muted{color:#444}
</style>
</head>
<body>
<div id="splash"></div>
<div id="app"></div>
<div id="toast"></div>
<nav><div class="in" id="nav"></div></nav>
<script>
/* ============ helpers ============ */
const KEY='sterling.v1';
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const num=v=>{const n=parseFloat(String(v==null?'':v).replace(/[$,%\s]/g,''));return isFinite(n)?n:0};
const group=(n,d)=>Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
const fmt=(n,d)=>(n<0&&Math.round(Math.abs(n)*Math.pow(10,d==null?2:d))>0?'-':'')+'$'+group(n,d==null?2:d);
const fmt0=n=>fmt(n,0);
const sgn=(n,d)=>(n>0?'+':n<0?'−':'')+group(n,d==null?2:d);
const pad=n=>String(n).padStart(2,'0');
const dstr=dt=>dt.getFullYear()+'-'+pad(dt.getMonth()+1)+'-'+pad(dt.getDate());
const today=()=>dstr(new Date());
const mkey=d=>d.slice(0,7);
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
const mlabel=k=>MONTHS[+k.slice(5,7)-1]+' '+k.slice(0,4);
const mshift=(k,n)=>{const d=new Date(+k.slice(0,4),+k.slice(5,7)-1+n,1);return d.getFullYear()+'-'+pad(d.getMonth()+1)};
const daysIn=k=>new Date(+k.slice(0,4),+k.slice(5,7),0).getDate();
const dlabel=d=>{const x=new Date(+d.slice(0,4),+d.slice(5,7)-1,+d.slice(8,10));return ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][x.getDay()]+', '+MONTHS[x.getMonth()].slice(0,3)+' '+x.getDate()};
const ago=ts=>{const s=Math.max(0,(Date.now()-ts)/1000);if(s<90)return 'just now';if(s<3600)return Math.round(s/60)+' min ago';if(s<86400)return Math.round(s/3600)+' h ago';return Math.round(s/86400)+' d ago'};
const hash=s=>{let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0};

/* ============ quotes ============ */
const QUOTES=[
['Do not save what is left after spending; instead spend what is left after saving.','Warren Buffett'],
['Beware of little expenses; a small leak will sink a great ship.','Benjamin Franklin'],
['An investment in knowledge pays the best interest.','Benjamin Franklin'],
['The stock market is a device for transferring money from the impatient to the patient.','Warren Buffett'],
['Price is what you pay. Value is what you get.','Warren Buffett'],
['Don’t look for the needle in the haystack. Just buy the haystack.','John Bogle'],
['The four most dangerous words in investing are: this time it’s different.','Sir John Templeton'],
['Someone is sitting in the shade today because someone planted a tree a long time ago.','Warren Buffett'],
['Never depend on a single income. Make an investment to create a second source.','Warren Buffett'],
['Risk comes from not knowing what you’re doing.','Warren Buffett'],
['The best investment you can make is in yourself.','Warren Buffett'],
['Be fearful when others are greedy, and greedy when others are fearful.','Warren Buffett'],
['The first rule of compounding: never interrupt it unnecessarily.','Charlie Munger'],
['Know what you own, and know why you own it.','Peter Lynch'],
['You do not rise to the level of your goals. You fall to the level of your systems.','James Clear'],
['Financial peace isn’t the acquisition of stuff. It’s learning to live on less than you make.','Dave Ramsey'],
['The habit of saving is itself an education.','T. T. Munger'],
['It’s not how much money you make, but how much money you keep.','Robert Kiyosaki'],
['Time in the market beats timing the market.','Wall Street saying'],
['Pay yourself first.','Old rule'],
['Every dollar needs a job.','Budgeting rule'],
['Spend less than you earn. Invest the difference. Repeat for decades.','Sterling'],
['Compound interest rewards patience and punishes debt.','Sterling'],
['A budget is not a cage. It is a plan for your money.','Sterling'],
['Cash gives you options. Options give you freedom.','Sterling'],
['Wealth is built in the boring middle.','Sterling'],
['Small amounts, saved on purpose, beat big plans saved someday.','Sterling']
];

/* ============ state ============ */
const CATS0=[
 ['rent','Housing','need',25],['groc','Groceries','need',10],['trans','Transport','need',8],['bills','Bills & phone','need',7],
 ['eat','Eating out','want',10],['fun','Fun','want',8],['shop','Shopping','want',7],['subs','Subscriptions','want',5],
 ['goals','Goals & savings','save',10],['inv','Investing','save',10]
];
const GRP=[['need','Needs','50%'],['want','Wants','30%'],['save','Savings & investing','20%']];
function fresh(){
 return{set:{name:'',income:0,quotes:true,age:'',ess:0,debt:0,rate:0,guard:false,match:false},
  tx:[],
  cats:CATS0.map(c=>({id:c[0],name:c[1],grp:c[2],p:c[3],lim:0})),
  goals:[{id:'ef',name:'Emergency fund',target:1000,saved:0}],
  watch:['SPY','VOO','AAPL','MSFT','NVDA','TSLA'],hold:{},qd:{},news:{},lastQ:-1,
  calc:{start:0,mo:100,r:7,fee:0.05,yrs:40}};
}
function load(){
 const f=fresh();
 try{const j=JSON.parse(localStorage.getItem(KEY));
  if(j&&j.cats){j.set=Object.assign(f.set,j.set);j.calc=Object.assign(f.calc,j.calc);['tx','goals','watch'].forEach(k=>{if(!Array.isArray(j[k]))j[k]=f[k]});['hold','qd','news'].forEach(k=>{if(!j[k])j[k]={}});return j}}catch(e){}
 return f;
}
let S=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

/* ============ toast + splash ============ */
let toastT;
function toast(m){const e=$('#toast');e.textContent=m;e.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>e.classList.remove('show'),2600)}
let splashT;
function splash(force){
 const el=$('#splash');
 if(!S.set.quotes&&!force){el.style.display='none';return}
 el.style.display='flex';el.classList.remove('out');
 let i;do{i=Math.floor(Math.random()*QUOTES.length)}while(i===S.lastQ&&QUOTES.length>1);
 S.lastQ=i;save();
 const q=QUOTES[i];
 el.innerHTML='<div class="mk">Sterling</div><div class="qt">“'+esc(q[0])+'”</div><div class="au">'+esc(q[1])+'</div><div class="ln"><i></i></div>';
 const hide=()=>{clearTimeout(splashT);el.classList.add('out');setTimeout(()=>{el.style.display='none'},750)};
 el.onclick=hide;splashT=setTimeout(hide,3500);
}
/* ============ budget + home ============ */
let mo=mkey(today()),form={t:'s'},editCat=null,delArm=null,gadd=null,gedit=null;
const catOf=id=>S.cats.find(c=>c.id===id);
const txOf=m=>S.tx.filter(t=>mkey(t.d)===m);
const stat=(l,v)=>'<div class="stat"><div class="muted">'+l+'</div><div class="mid">'+v+'</div></div>';
function totals(m){
 let inc=0,sp=0,sv=0;const by={};
 txOf(m).forEach(t=>{
  if(t.t==='i'){inc+=t.amt;return}
  by[t.cat]=(by[t.cat]||0)+t.amt;
  const c=catOf(t.cat);if(c&&c.grp==='save')sv+=t.amt;else sp+=t.amt;
 });
 const base=inc||S.set.income||0;
 return{inc,sp,sv,by,base,left:base-sp-sv};
}
function applyPlan(inc){S.cats.forEach(c=>{if(c.p)c.lim=Math.round(inc*c.p/100)})}
function insights(){
 const m=mkey(today()),t=totals(m),base=t.base,out=[];
 const dom=new Date().getDate(),dim=daysIn(m);
 if(!txOf(m).length){out.push('Log your first transaction to unlock insights. Two weeks of honest tracking shows where the money actually goes.');return out}
 if(base>0){
  const proj=t.sp/dom*dim;
  out.push('At this pace you will spend about '+fmt0(proj)+' this month'+(proj>base*.8?', which is '+Math.round(proj/base*100)+'% of your income. That leaves little to save.':', leaving room to save or invest.'));
  const sr=t.sv/base;
  out.push('Savings rate so far: '+Math.round(sr*100)+'%. A common target is 20% or more.'+(sr<.2?' Moving even 5% more into savings changes the long-run math.':''));
 }
 const over=S.cats.filter(c=>c.grp!=='save'&&c.lim>0&&(t.by[c.id]||0)>c.lim);
 if(over.length)out.push('Over budget: '+over.map(c=>c.name+' ('+fmt0(t.by[c.id]-c.lim)+' over)').join(', ')+'.');
 const w=S.cats.filter(c=>c.grp==='want').sort((a,b)=>(t.by[b.id]||0)-(t.by[a.id]||0))[0];
 if(w&&(t.by[w.id]||0)>0)out.push('Biggest "want": '+w.name+' at '+fmt0(t.by[w.id])+'. Trimming 20% there is easier than trimming rent.');
 return out.slice(0,4);
}
function greet(){const h=new Date().getHours();return h<12?'Good morning':h<18?'Good afternoon':'Good evening'}

function goalRow(g){
 const p=g.target>0?Math.min(100,g.saved/g.target*100):0;
 let h='<div style="padding:10px 0;border-bottom:1px solid var(--g2)"><div class="row between"><div class="grow"><b>'+esc(g.name)+'</b><div class="muted">'+fmt0(g.saved)+' of '+fmt0(g.target)+' · '+Math.round(p)+'%</div></div><button class="ghost sm" data-a="gadd" data-v="'+g.id+'">+ Add</button><button class="ghost sm" data-a="gedit" data-v="'+g.id+'">Edit</button></div><div class="bar"><i style="width:'+p+'%"></i></div>';
 if(gadd===g.id)h+='<div class="row" style="margin-top:8px"><input type="number" inputmode="decimal" id="ga" placeholder="Amount to add"><button data-a="gput" data-v="'+g.id+'">Add</button></div>';
 if(gedit===g.id)h+='<div class="grid2" style="margin-top:8px"><input type="text" id="gn" maxlength="28" value="'+esc(g.name)+'"><input type="number" inputmode="decimal" id="gt" value="'+g.target+'"></div><div class="row" style="margin-top:8px"><button class="sm" data-a="gsave" data-v="'+g.id+'">Save</button>'+(g.id==='ef'?'':'<button class="ghost sm" data-a="gdel" data-v="'+g.id+'">'+(delArm===g.id?'Tap again to delete':'Delete')+'</button>')+'</div>';
 return h+'</div>';
}

function vHome(){
 const m=mkey(today()),t=totals(m);
 const dom=new Date().getDate(),dim=daysIn(m),rem=dim-dom+1;
 let h='<div class="row between" style="margin:4px 4px 12px"><div><div class="muted">'+greet()+'</div><h1 style="font-size:26px">'+esc(S.set.name||'Your money')+'</h1></div><button class="ghost sm" data-a="q">Quote</button></div>';
 if(t.base>0){
  h+='<div class="hl"><div class="muted">Left this month</div><div class="big">'+fmt(t.left,0)+'</div><div class="muted" style="margin-top:4px">'+(t.left>0?'About '+fmt(t.left/rem,0)+' a day for the next '+rem+' day'+(rem===1?'':'s'):'Over plan. Pause wants until next month.')+'</div></div>';
 }else{
  h+='<div class="hl"><div class="muted">Welcome</div><div class="mid" style="margin:4px 0 6px">Start by adding your monthly take-home pay</div><div class="muted">Open Budget, set your pay, and every category fills in with a 50/30/20 plan.</div></div>';
 }
 h+='<div class="card"><div class="grid2">'+stat('Income',fmt0(t.inc))+stat('Spent',fmt0(t.sp))+stat('Saved',fmt0(t.sv))+stat('Savings rate',t.base>0?Math.round(t.sv/t.base*100)+'%':'—')+'</div></div>';
 h+='<div class="row" style="margin-bottom:12px"><button class="grow" data-a="quick" data-v="s">+ Spend</button><button class="grow ghost" data-a="quick" data-v="i">+ Income</button></div>';
 h+='<h2>Insights</h2><div class="card">'+insights().map(s=>'<p style="margin-bottom:8px">'+esc(s)+'</p>').join('')+'</div>';
 h+='<h2>Goals</h2><div class="card">'+S.goals.map(goalRow).join('')
  +'<div class="row" style="margin-top:12px"><input type="text" id="gnn" maxlength="28" placeholder="New goal (e.g. Laptop)"><input type="number" inputmode="decimal" id="gnt" placeholder="Target" style="max-width:110px"><button data-a="gnew">Add</button></div></div>';
 h+='<h2>Markets</h2><div class="card" data-a="tab" data-v="mkt" style="cursor:pointer">'+S.watch.slice(0,4).map(sym=>stockRow(sym,true)).join('')+'<div class="tiny" style="margin-top:8px">Tap for the full watchlist and news ›</div></div>';
 return h;
}

function catRow(c,t){
 const spent=t.by[c.id]||0,save=c.grp==='save';
 const p=c.lim>0?Math.min(100,spent/c.lim*100):(spent>0?100:0),over=!save&&c.lim>0&&spent>c.lim;
 let h='<div class="cat"><div data-a="catedit" data-v="'+c.id+'"><div class="row between"><b>'+esc(c.name)+'</b><span class="muted">'+fmt0(spent)+' / '+fmt0(c.lim)+'</span></div><div class="bar'+(over?' over':'')+'"><i style="width:'+p+'%"></i></div><div class="tiny">'+(c.lim>0?(over?fmt0(spent-c.lim)+' over':fmt0(Math.max(0,c.lim-spent))+(save?' to go':' left')):'No limit set — tap to edit')+'</div></div>';

function safeRender(){const ae=document.activeElement;if(ae&&/INPUT|TEXTAREA|SELECT/.test(ae.tagName))return;render()}

async function jget(url,text){
 const ctl=typeof AbortController!=='undefined'?new AbortController():null;
 const to=setTimeout(()=>{if(ctl)ctl.abort()},9000);
 try{const r=await fetch(url,ctl?{signal:ctl.signal}:{});if(!r.ok)throw new Error('HTTP '+r.status);return text?await r.text():await r.json()}
 finally{clearTimeout(to)}
}
async function yahoo(sym,range){
 const j=await jget('https://query1.finance.yahoo.com/v8/finance/chart/'+encodeURIComponent(sym)+'?range='+range+'&interval=1d');
 const r=j.chart&&j.chart.result&&j.chart.result[0];if(!r)throw new Error('no data');
 const cl=((r.indicators.quote[0]||{}).close||[]).filter(x=>x!=null);
 const p=r.meta.regularMarketPrice!=null?r.meta.regularMarketPrice:cl[cl.length-1];
 if(!cl.length||p==null)throw new Error('empty');
 const prev=cl.length>1?cl[cl.length-2]:(r.meta.chartPreviousClose||p);
 return{p,prev,name:r.meta.shortName||r.meta.longName||sym,c:cl};
}
async function stooq(sym,range){
 const t=await jget('https://stooq.com/q/d/l/?s='+encodeURIComponent(sym.toLowerCase())+'.us&i=d',true);
 const rows=t.trim().split('\n').slice(1).map(l=>l.split(',')).filter(r=>r.length>=5&&isFinite(+r[4]));
 if(rows.length<2)throw new Error('no data');
 const cl=rows.slice(-(RNG[range][1]+1)).map(r=>+r[4]);
 return{p:cl[cl.length-1],prev:cl[cl.length-2],name:sym,c:cl};
}
async function series(sym,range){try{return await yahoo(sym,range)}catch(e){return await stooq(sym,range)}}
function store(sym,range,d){
 const q=S.qd[sym]||(S.qd[sym]={c:{}});
 q.p=d.p;q.prev=d.prev;q.name=(d.name&&d.name!==sym)?d.name:(q.name||sym);q.ts=Date.now();q.c[range]=d.c;
}
async function refreshAll(){
 if(refreshing)return;refreshing=true;let ok=0;
 await Promise.all(S.watch.map(async s=>{try{store(s,'1mo',await series(s,'1mo'));ok++}catch(e){}}));
 refreshing=false;live=ok>0;if(ok)save();safeRender();
}
async function ensureRange(sym,range){
 const q=S.qd[sym],k=sym+range;
 if(!q||q.c[range]||rngBusy[k]||live===false)return;
 rngBusy[k]=1;try{store(sym,range,await series(sym,range));save()}catch(e){}rngBusy[k]=0;safeRender();
}

/* demo data (only shown when live data is unreachable, e.g. in the browser preview) */
const demoC={};
function demo(sym,n){
 const k=sym+n;if(demoC[k])return demoC[k];
 let h=hash(sym)||1;const r=()=>{h^=h<<13;h>>>=0;h^=h>>>17;h^=h<<5;h>>>=0;return h/4294967296};
 let p=30+(hash(sym)%47)*9;const vol=.012+(hash(sym+'v')%10)/1000;const c=[];
 for(let i=0;i<n;i++){p*=1+(r()-.47)*vol*2;c.push(Math.round(p*100)/100)}
 return demoC[k]={p:c[n-1],prev:c[n-2],name:sym,c,demo:true};
}
function qv(sym,range){
 range=range||'1mo';const q=S.qd[sym];
 if(q&&q.p!=null){return{p:q.p,prev:q.prev,name:q.name||sym,c:q.c[range]||null,ts:q.ts,demo:false}}
 if(live===false)return Object.assign({ts:0},demo(sym,RNG[range][1]));
 return{loading:true};
}

function spark(a,w,h,up){
 if(!a||a.length<2)return '<svg width="'+w+'" height="'+h+'"></svg>';
 const mn=Math.min.apply(null,a),mx=Math.max.apply(null,a),rg=(mx-mn)||1;
 const pts=a.map((v,i)=>(i/(a.length-1)*(w-2)+1).toFixed(1)+','+(h-2-(v-mn)/rg*(h-4)).toFixed(1)).join(' ');
 return '<svg width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'"><polyline points="'+pts+'" fill="none" stroke="'+(up?'#fff':'#a8a8a8')+'" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"'+(up?'':' stroke-dasharray="3 3"')+'/></svg>';
}
function chart(a,up){
 const w=400,h=170,pl=6,pr=6,pt=10,pb=10;
 if(!a||a.length<2)return '<div class="muted" style="padding:50px 0;text-align:center">Loading chart…</div>';
 const mn=Math.min.apply(null,a),mx=Math.max.apply(null,a),rg=(mx-mn)||1;
 const X=i=>pl+i/(a.length-1)*(w-pl-pr),Y=v=>pt+(1-(v-mn)/rg)*(h-pt-pb);
 const pts=a.map((v,i)=>X(i).toFixed(1)+','+Y(v).toFixed(1)).join(' ');
 const area=pts+' '+X(a.length-1).toFixed(1)+','+(h-pb)+' '+X(0).toFixed(1)+','+(h-pb);
 let g='';[0,1,2,3].forEach(i=>{const y=pt+i*(h-pt-pb)/3;g+='<line x1="'+pl+'" x2="'+(w-pr)+'" y1="'+y+'" y2="'+y+'" stroke="#222"/>'});
 return '<svg viewBox="0 0 '+w+' '+h+'" width="100%" style="display:block">'+g+'<polygon points="'+area+'" fill="#fff" opacity=".07"/><polyline points="'+pts+'" fill="none" stroke="'+(up?'#fff':'#a8a8a8')+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"'+(up?'':' stroke-dasharray="5 4"')+'/><circle cx="'+X(a.length-1).toFixed(1)+'" cy="'+Y(a[a.length-1]).toFixed(1)+'" r="3.5" fill="'+(up?'#fff':'#a8a8a8')+'"/></svg>'
  +'<div class="row between tiny" style="margin-top:4px"><span>Low '+fmt(mn)+'</span><span>High '+fmt(mx)+'</span></div>';
}

/* news via Google News RSS (no key). Works in the app; blocked in the browser preview. */
function parseRSS(xml){
 const d=new DOMParser().parseFromString(xml,'text/xml');
 return Array.prototype.slice.call(d.querySelectorAll('item'),0,25).map(it=>{
  const g=t=>{const e=it.querySelector(t);return e?e.textContent:''};
  let title=g('title'),src=g('source');
  if(src&&title.endsWith(' - '+src))title=title.slice(0,-(src.length+3));
  else if(!src){const i=title.lastIndexOf(' - ');if(i>0){src=title.slice(i+3);title=title.slice(0,i)}}
  return{t:title,u:g('link'),s:src,ts:Date.parse(g('pubDate'))||0};
 });
}

 if(key==='top')return 'https://news.google.com/rss/headlines/section/topic/BUSINESS?hl=en-US&gl=US&ceid=US:en';

function fv(start,mo,r,yrs){let b=start;const m=r/1200;for(let i=0;i<Math.round(yrs*12);i++)b=b*(1+m)+mo;return b}
function dual(bal,con){
 const w=400,h=150,pl=6,pr=6,pt=8,pb=8;
 const mx=Math.max.apply(null,bal.concat(con))||1;
 const X=i=>pl+i/(bal.length-1)*(w-pl-pr),Y=v=>pt+(1-v/mx)*(h-pt-pb);
 const line=a=>a.map((v,i)=>X(i).toFixed(1)+','+Y(v).toFixed(1)).join(' ');
 return '<svg viewBox="0 0 '+w+' '+h+'" width="100%" style="display:block"><line x1="'+pl+'" x2="'+(w-pr)+'" y1="'+(h-pb)+'" y2="'+(h-pb)+'" stroke="#333"/><polygon points="'+line(bal)+' '+X(bal.length-1)+','+(h-pb)+' '+X(0)+','+(h-pb)+'" fill="#fff" opacity=".08"/><polyline points="'+line(con)+'" fill="none" stroke="#a8a8a8" stroke-width="2" stroke-dasharray="5 4"/><polyline points="'+line(bal)+'" fill="none" stroke="#fff" stroke-width="2.4" stroke-linejoin="round"/></svg>'
  +'<div class="row tiny" style="gap:16px;margin-top:4px"><span>── Balance</span><span>- - - You put in</span></div>';
}
function calcHTML(){
 const c=S.calc,r=c.r-c.fee,yrs=Math.max(1,Math.min(60,Math.round(c.yrs)||1));
 const bal=[],con=[];for(let y=0;y<=yrs;y++){bal.push(fv(c.start,c.mo,r,y));con.push(c.start+c.mo*12*y)}
 const end=bal[yrs],put=con[yrs];
 let h='<div class="row between" style="align-items:flex-end;margin-bottom:8px"><div><div class="muted">After '+yrs+' years</div><div class="big">'+fmt0(end)+'</div></div><div style="text-align:right"><div class="muted">You put in '+fmt0(put)+'</div><div class="muted">Growth '+fmt0(end-put)+'</div></div></div>'+dual(bal,con);
 const base=fv(c.start,0,r,yrs);
 h+='<div class="dh" style="margin-top:14px">The cost of waiting</div>';
 [0,5,10].forEach(w=>{if(w>=yrs)return;const v=base+fv(0,c.mo,r,yrs-w);h+='<div class="row between" style="padding:6px 0;border-bottom:1px solid var(--g2)"><span>'+(w?'Start '+w+' years later':'Start now')+'</span><b>'+fmt0(v)+(w?' <span class="muted">('+sgn(v-end,0).replace(/^([+−])/,'$1$')+')</span>':'')+'</b></div>'});
 h+='<div class="tiny" style="margin-top:8px">Assumes a steady '+group(r,2)+'% a year after fees. Real markets are bumpy and nothing is guaranteed. A 7% nominal return is a common planning figure; use 5% to be conservative.</div>';
 return h;
}

];
const GLOSS=[
 ['APR / APY','APR is the yearly interest rate on debt. APY is what a savings account actually pays after compounding.'],
 ['ETF','A fund that holds many investments and trades on an exchange like a stock.'],
 ['Index fund','A fund built to match a market index instead of trying to beat it.'],
 ['Expense ratio','The yearly fee a fund charges, as a percentage of your money.'],
 ['Dividend','A cash payment some companies make to shareholders from profits.'],
 ['Bull / bear market','Bull: prices rising broadly. Bear: prices down about 20% or more from a recent high.'],
 ['P/E ratio','Price divided by earnings per share. Higher can mean investors expect more growth, or that the stock is expensive.'],
 ['Market cap','Share price times shares outstanding: the total value of a company.'],
 ['Inflation','The rising cost of things over time. It shrinks cash that sits still.'],
 ['Liquidity','How quickly you can turn something into cash without losing value.'],
 ['Capital gain','Profit from selling an investment for more than you paid.'],
 ['Rebalancing','Adjusting your holdings back to your target mix once a year or so.']
];
function vLearn(){
 let h='<div class="hl"><div class="muted">The money maximizer</div><div class="mid" style="font-size:20px;margin:4px 0 8px">Ten moves in the right order</div><div class="muted" style="line-height:1.55">1. Track spending for two weeks.<br>2. Build a $1,000 starter fund.<br>3. Capture any employer or TSP match.<br>4. Kill debt above ~8% APR.<br>5. Open a Roth IRA and invest in a broad index fund.<br>6. Automate everything on payday.<br>7. Grow the emergency fund to 3–6 months.<br>8. Raise your income and your savings rate together.<br>9. Max tax-advantaged accounts.<br>10. Leave it alone and let time work.</div><button class="full" data-a="tab" data-v="adv" style="margin-top:12px;background:#000;color:#fff">See where you are</button></div>';
 LEARN.forEach((g,gi)=>{
  h+='<h2>'+g.g+'</h2><div class="card">'+g.items.map((it,i)=>{const k=gi+'-'+i,o=openAcc[k];return '<div class="acc"><div class="ah" data-a="open" data-v="'+k+'"><span>'+esc(it[0])+'</span><span class="pl">'+(o?'−':'+')+'</span></div>'+(o?'<div class="ab">'+it[1]+'</div>':'')+'</div>'}).join('')+'</div>';
 });
 h+='<h2>Glossary</h2><div class="card">'+GLOSS.map((g,i)=>{const k='g-'+i,o=openAcc[k];return '<div class="acc"><div class="ah" data-a="open" data-v="'+k+'"><span>'+esc(g[0])+'</span><span class="pl">'+(o?'−':'+')+'</span></div>'+(o?'<div class="ab">'+esc(g[1])+'</div>':'')+'</div>'}).join('')+'</div>';
 h+='<div class="tiny" style="margin:0 4px">Educational content, not personalized financial, tax or legal advice. Limits, rates and rules change, so verify with the IRS, your plan administrator or a licensed professional before acting.</div>';
 return h;
}
function learnClick(a,v){
 if(a==='open'){openAcc[v]=!openAcc[v];const y=window.scrollY;render();window.scrollTo(0,y);return true}
 return false;
}
/* ============ settings ============ */
function vSet(){
 return '<h2>Profile</h2><div class="card"><div class="fld"><div class="muted">Your name</div><input type="text" maxlength="16" data-c="name" value="'+esc(S.set.name)+'" placeholder="Shown on Home"></div><div class="fld" style="margin-bottom:0"><div class="muted">Monthly take-home pay</div><input type="number" inputmode="decimal" data-c="income" value="'+(S.set.income||'')+'" placeholder="e.g. 1800"></div><div class="tiny" style="margin-top:8px">Used for your daily allowance and savings rate. To refill every budget limit from it, use "Reset limits" in Budget.</div></div>'
 +'<h2>Launch</h2><div class="card"><label class="sw"><span>Show a money quote when the app opens</span><input type="checkbox" data-c="quotes" '+(S.set.quotes?'checked':'')+'></label></div>'
 +'<h2>Backup</h2><div class="card"><div class="tiny" style="margin-bottom:8px">Everything is stored on this device only. Export your data as text to keep a copy or move it to a new phone, and paste it back here to restore.</div><textarea id="bk" spellcheck="false" placeholder="Export fills this box. Paste a backup here to import."></textarea><div class="row" style="margin-top:8px"><button class="ghost grow" data-a="bkx">Export</button><button class="ghost grow" data-a="bki">Import</button></div></div>'
 +'<h2>Data</h2><div class="card"><button class="ghost full" data-a="reset">'+(delArm==='reset'?'Tap again to erase everything':'Reset all data')+'</button></div>'
 +'<div class="tiny" style="margin:0 4px">Sterling is a planning and learning tool. Market data comes from public sources and may be delayed or wrong. Nothing here is financial advice.</div>';
}

/* ============ nav + render ============ */
let tab='home';
const ICON={
 home:'<path d="M3 11l9-8 9 8v10h-6v-6H9v6H3z"/>',
 bud:'<rect x="3" y="6" width="18" height="14" rx="3"/><path d="M3 10h18M16 15h2"/>',
 mkt:'<path d="M3 17l6-6 4 4 8-9M15 6h6v6"/>',
 adv:'<circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/>',
 learn:'<path d="M4 5a2 2 0 012-2h13v16H6a2 2 0 00-2 2zM4 19a2 2 0 012-2h13"/>',
 set:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/>'
};
function renderNav(){
 const tabs=[['home','Home'],['bud','Budget'],['mkt','Markets'],['adv','Advisor'],['learn','Learn'],['set','Settings']];
 $('#nav').innerHTML=tabs.map(t=>'<button data-a="tab" data-v="'+t[0]+'" class="'+(tab===t[0]?'on':'')+'"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+ICON[t[0]]+'</svg>'+t[1]+'</button>').join('');
}
function render(){
 const m={home:vHome,bud:vBudget,mkt:vMkt,adv:vAdv,learn:vLearn,set:vSet};
 const y=window.scrollY;$('#app').innerHTML=m[tab]();window.scrollTo(0,y);renderNav();
}
function needRefresh(){const last=Math.max.apply(null,[0].concat(Object.keys(S.qd).map(k=>S.qd[k].ts||0)));return Date.now()-last>3e5}

/* ============ events ============ */
document.addEventListener('click',e=>{
 const b=e.target.closest('[data-a]');if(!b)return;
 const a=b.dataset.a,v=b.dataset.v;
 if(a==='tab'){if(tab===v&&v==='mkt')sel=null;tab=v;window.scrollTo(0,0);render();if(v==='mkt'||v==='home'){if(live===null||needRefresh())refreshAll()}return}
 if(budgetClick(a,v,b)||marketClick(a,v,b)||advClick(a,v)||learnClick(a,v))return;
 if(a==='bkx'){
  const o=JSON.stringify({set:S.set,tx:S.tx,cats:S.cats,goals:S.goals,watch:S.watch,hold:S.hold,calc:S.calc});
  const t=$('#bk');t.value=o;t.select();
  try{navigator.clipboard.writeText(o).then(()=>toast('Copied to clipboard'),()=>toast('Select and copy the text'))}catch(x){toast('Select and copy the text')}
 }else if(a==='bki'){
  try{const j=JSON.parse($('#bk').value);if(!j||!Array.isArray(j.cats)||!Array.isArray(j.tx))throw 0;const f=fresh();S=Object.assign(f,j);S.set=Object.assign(fresh().set,j.set);S.calc=Object.assign(fresh().calc,j.calc);S.qd={};S.news={};save();render();toast('Backup restored')}catch(x){toast('That does not look like a Sterling backup')}
 }else if(a==='reset'){
  armed('reset',()=>{try{localStorage.removeItem(KEY)}catch(x){}S=fresh();save();tab='home';mo=mkey(today());render();toast('All data erased')});
 }
});
document.addEventListener('change',e=>{
 const t=e.target,d=t.dataset;if(!d)return;
 if(d.c){
  if(d.c==='quotes')S.set.quotes=t.checked;
  else if(d.c==='income')S.set.income=Math.max(0,num(t.value));
  else S.set[d.c]=t.value.trim();
  save();
 }else if(d.p){
  if(t.type==='checkbox')S.set[d.p]=t.checked;else S.set[d.p]=Math.max(0,num(t.value));
  save();render();
 }
});
document.addEventListener('input',e=>{
 const t=e.target;
 if(t.dataset&&t.dataset.k){S.calc[t.dataset.k]=num(t.value);save();const o=$('#calcOut');if(o)o.innerHTML=calcHTML()}
});

/* ============ boot ============ */
splash();render();refreshAll();
</script>
</body>
</html>
